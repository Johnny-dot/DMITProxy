name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  target:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - name: Select the tested main commit
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid deployment SHA');
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== sha) {
              core.notice('A newer main commit exists; this deployment is superseded.');
              core.setOutput('deploy', 'false');
              return;
            }
            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', head_sha: sha, status: 'completed', per_page: 50,
              });
              if (!data.workflow_runs.some(run => run.head_sha === sha && run.conclusion === 'success')) {
                throw new Error('Run CI successfully for this main SHA before deploying.');
              }
            }
            core.setOutput('sha', sha);
            core.setOutput('deploy', 'true');

  deploy:
    needs: target
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: /home/ubuntu/apps/DMITProxy
          BRANCH: main
          NODE_VERSION: 24
          PM2_NAME: dmit-proxy
          DEPLOY_SHA: ${{ needs.target.outputs.sha }}
          HEALTHCHECK_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "APP_DIR='$APP_DIR' BRANCH='$BRANCH' NODE_VERSION='$NODE_VERSION' PM2_NAME='$PM2_NAME' DEPLOY_SHA='$DEPLOY_SHA' HEALTHCHECK_URL='$HEALTHCHECK_URL' bash -s" \
            < ./scripts/deploy/remote-deploy.sh | tee deploy.log

      - name: Publish deploy summary
        if: always()
        env:
          DEPLOY_SHA: ${{ needs.target.outputs.sha }}
        run: |
          {
            echo "## Deploy"
            echo "Tested commit: $DEPLOY_SHA"
            echo '```text'
            tail -n 60 deploy.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
